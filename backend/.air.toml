# .air.toml
# Config for Air: https://github.com/cosmtrek/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  # Points to your actual entry point in the cmd/server folder
  cmd = "go build -o ./tmp/main.exe ./cmd/server/main.go"
  bin = "./tmp/main.exe"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  include_dir = []
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  delay = 500 # Lowered to 500ms for faster "vibe coding" response
  stop_on_error = true
  send_interrupt = false
  kill_delay = "0s"

[build.windows]
  args_bin = []
  cmd = "go build -o ./tmp/main.exe ./cmd/server/main.go"
  bin = ".\\tmp\\main.exe"
  entrypoint = [".\\tmp\\main.exe"]
  full_bin = ""

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true # Set to true to help prevent zombie processes on Windows

[screen]
  clear_on_rebuild = false
  keep_scroll = true